name: Java build and smoke tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac EmployeeManagement.java
      - run: |
          printf '1\n10\nTest Name\nDeveloper\n1000\n2\n4\n' | java EmployeeManagement > output.txt
          grep -q '10,Test Name,Developer,1000.0' Employee.txt
          grep -q 'Employee Records:' output.txt
